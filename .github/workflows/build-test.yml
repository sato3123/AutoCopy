name: build-and-test

on:
  push:
    branches-ignore: [release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Windows / .NET Framework version
        shell: pwsh
        run: |
          [System.Environment]::OSVersion
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release

      - name: Build app with build.bat (Shift-JIS console)
        shell: cmd
        run: |
          chcp 932
          call build.bat > build-console.txt 2>&1
          set RC=%ERRORLEVEL%
          type build-console.txt
          if not "%RC%"=="0" exit /b 1
          dir dist

      - name: Build a newer version for the auto-update test (version 99)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force dist-next | Out-Null
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 /define:UPDATETEST /win32icon:app.ico /out:dist-next\AutoCopy.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Runtime.Serialization.dll /r:System.Xml.dll /r:System.Security.dll `
            src\*.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-Item dist-next\AutoCopy.exe).VersionInfo.FileVersion

      - name: Build a broken newer version for the update rollback test (version 100, exits right after update)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force dist-bad | Out-Null
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 /define:UPDATETEST`;UPDATEFAIL /win32icon:app.ico /out:dist-bad\AutoCopy.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Runtime.Serialization.dll /r:System.Xml.dll /r:System.Security.dll `
            src\*.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-Item dist-bad\AutoCopy.exe).VersionInfo.FileVersion

      - name: Build test runner
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $sources = @(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          $tests = @(Get-ChildItem tests -Filter '*.cs' | ForEach-Object FullName)
          New-Item -ItemType Directory -Force test | Out-Null
          & $csc /nologo /target:exe /main:AutoCopy.Tests.TestMain /platform:anycpu /codepage:65001 /out:test\AutoCopyTests.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Runtime.Serialization.dll /r:System.Xml.dll /r:System.Security.dll `
            @sources @tests
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prepare SMB share with a separate user
        shell: pwsh
        run: |
          $pw = 'Ac!Test-12345'
          net user actest $pw /add
          New-Item -ItemType Directory -Force C:\acshare | Out-Null
          icacls C:\acshare /grant "actest:(OI)(CI)F" | Out-Null
          New-SmbShare -Name acshare -Path C:\acshare -FullAccess actest | Out-Null
          "AC_SHARE=\\127.0.0.1\acshare" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_SHARE_LOCAL=C:\acshare"    | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_USER=$env:COMPUTERNAME\actest" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_PASS=$pw"                  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run tests
        shell: pwsh
        run: |
          .\test\AutoCopyTests.exe "$pwd\test-results.md" *> test-console.txt
          $code = $LASTEXITCODE
          Get-Content -Encoding utf8 test-console.txt
          "## Unit / engine tests (${{ matrix.os }})" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content -Encoding utf8 test-results.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Integration test (real exe, tray, single instance, /run)
        if: always()
        shell: pwsh
        run: ./tests/integration.ps1 *>&1 | Tee-Object -FilePath integration-console.txt

      - name: Screenshots of all screens
        if: always()
        shell: pwsh
        run: |
          $env:AUTOCOPY_HOME = "$env:RUNNER_TEMP\shots-home"
          $p = Start-Process -FilePath "dist\AutoCopy.exe" -ArgumentList '/screenshots', "`"$pwd\screenshots`"" -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); "timeout" | Out-File screenshots\timeout.txt }
          Get-ChildItem screenshots | Select-Object Name, Length
          if (Test-Path screenshots\progress.txt) { "progress: " + (Get-Content -Encoding utf8 screenshots\progress.txt) }
          if (Test-Path screenshots\timing.txt) { Get-Content -Encoding utf8 screenshots\timing.txt | Select-Object -Last 8 }
          Get-Content -Encoding utf8 screenshots\errors.txt
          if ($p.ExitCode -ne 0 -or (Test-Path screenshots\timeout.txt)) { throw "Screenshot checks failed" }

      - name: Layout check at 125% / 150% text size (Windows 7 style DPI) and a small screen
        if: always()
        shell: pwsh
        run: |
          foreach ($cfg in '1.25|', '1.5|', '1|1093x582') {
            $sc, $scr = $cfg.Split('|')
            $dir = if ($scr) { "screenshots-small" } else { "screenshots-" + ($sc -replace '\.', '') }
            $env:AUTOCOPY_HOME = "$env:RUNNER_TEMP\shots-home-$sc-$scr"
            $env:AUTOCOPY_FONTSCALE = $sc
            $env:AUTOCOPY_SCREEN = if ($scr) { $scr } else { '1366x728' }
            $p = Start-Process -FilePath "dist\AutoCopy.exe" -ArgumentList '/screenshots', "`"$pwd\$dir`"" -PassThru
            if (-not $p.WaitForExit(420000)) { $p.Kill(); "timeout" | Out-File "$dir\timeout.txt" }
            "$cfg : " + (Get-Content -Encoding utf8 "$dir\layout-count.txt")
            if ($p.ExitCode -ne 0 -or (Test-Path "$dir\timeout.txt")) { throw "Layout checks failed: $cfg" }
          }
          Remove-Item Env:AUTOCOPY_FONTSCALE
          if (Test-Path Env:AUTOCOPY_SCREEN) { Remove-Item Env:AUTOCOPY_SCREEN }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            test-results.md
            integration-results.md
            screenshots*/
            *console.txt
            dist/
