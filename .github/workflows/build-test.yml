name: build-and-test

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Windows / .NET Framework version
        shell: pwsh
        run: |
          [System.Environment]::OSVersion
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release

      - name: Build app with build.bat (Shift-JIS console)
        shell: cmd
        run: |
          chcp 932
          call build.bat > build-console.txt 2>&1
          set RC=%ERRORLEVEL%
          type build-console.txt
          if not "%RC%"=="0" exit /b 1
          dir dist

      - name: Build test runner
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $core = 'Models','Util','Native','NetAccess','SafeFs','StateStore','Exclude','Scanner','CopyEngine','DupChecker','Usage','Logger','Distribution','SystemIntegration','AppCore','AssemblyInfo' | ForEach-Object { "src\$_.cs" }
          New-Item -ItemType Directory -Force test | Out-Null
          & $csc /nologo /target:exe /platform:anycpu /codepage:65001 /out:test\AutoCopyTests.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Runtime.Serialization.dll /r:System.Xml.dll /r:System.Security.dll `
            @core tests\Tests.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prepare SMB share with a separate user
        shell: pwsh
        run: |
          $pw = 'Ac!Test-12345'
          net user actest $pw /add
          New-Item -ItemType Directory -Force C:\acshare | Out-Null
          icacls C:\acshare /grant "actest:(OI)(CI)F" | Out-Null
          New-SmbShare -Name acshare -Path C:\acshare -FullAccess actest | Out-Null
          "AC_SHARE=\\127.0.0.1\acshare" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_SHARE_LOCAL=C:\acshare"    | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_USER=$env:COMPUTERNAME\actest" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_PASS=$pw"                  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Run tests
        shell: pwsh
        run: |
          .\test\AutoCopyTests.exe "$pwd\test-results.md" *> test-console.txt
          $code = $LASTEXITCODE
          Get-Content -Encoding utf8 test-console.txt
          "## Unit / engine tests (${{ matrix.os }})" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content -Encoding utf8 test-results.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Integration test (real exe, tray, single instance, /run)
        if: always()
        shell: pwsh
        run: ./tests/integration.ps1 *>&1 | Tee-Object -FilePath integration-console.txt

      - name: Screenshots of all screens
        if: always()
        shell: pwsh
        run: |
          $env:AUTOCOPY_HOME = "$env:RUNNER_TEMP\shots-home"
          $p = Start-Process -FilePath "dist\AutoCopy.exe" -ArgumentList '/screenshots', "`"$pwd\screenshots`"" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); "timeout" | Out-File screenshots\timeout.txt }
          Get-ChildItem screenshots | Select-Object Name, Length
          Get-Content -Encoding utf8 screenshots\errors.txt

      - name: Layout check at 125% / 150% text size (Windows 7 style DPI)
        if: always()
        shell: pwsh
        run: |
          foreach ($sc in '1.25', '1.5') {
            $dir = "screenshots-" + ($sc -replace '\.', '')
            $env:AUTOCOPY_HOME = "$env:RUNNER_TEMP\shots-home-$sc"
            $env:AUTOCOPY_FONTSCALE = $sc
            $p = Start-Process -FilePath "dist\AutoCopy.exe" -ArgumentList '/screenshots', "`"$pwd\$dir`"" -PassThru
            if (-not $p.WaitForExit(240000)) { $p.Kill(); "timeout" | Out-File "$dir\timeout.txt" }
            Get-Content -Encoding utf8 "$dir\layout-count.txt"
          }
          Remove-Item Env:AUTOCOPY_FONTSCALE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            test-results.md
            integration-results.md
            screenshots/
            dist/

      - name: Publish results to ci-results branch
        if: always()
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\results"
          New-Item -ItemType Directory -Force "$dir\${{ matrix.os }}" | Out-Null
          foreach ($f in 'build-console.txt','test-results.md','test-console.txt','integration-results.md','integration-console.txt') { if (Test-Path $f) { Copy-Item $f "$dir\${{ matrix.os }}\" } }
          if (Test-Path screenshots) { Copy-Item -Recurse screenshots "$dir\${{ matrix.os }}\screenshots" }
          foreach ($x in 'screenshots-125', 'screenshots-15') { if (Test-Path $x) { Copy-Item -Recurse $x "$dir\${{ matrix.os }}\$x" } }
          if (Test-Path dist) { Copy-Item -Recurse dist "$dir\${{ matrix.os }}\dist" }
          $h = "$env:AUTOCOPY_HOME"
          Get-ChildItem -Recurse "$env:RUNNER_TEMP" -Filter "*.log" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*\logs\*' } | Select-Object -First 5 | ForEach-Object { Copy-Item $_.FullName "$dir\${{ matrix.os }}\app-$($_.Directory.Parent.Parent.Name)-$($_.Name)" }
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          $branch = "ci-results-${{ matrix.os }}"
          git fetch origin $branch 2>$null
          git worktree add -B $branch "$env:RUNNER_TEMP\wt" 2>$null
          if (-not $?) { git worktree add --orphan -b $branch "$env:RUNNER_TEMP\wt" }
          Set-Location "$env:RUNNER_TEMP\wt"
          git rm -rq . 2>$null
          Copy-Item -Recurse -Force "$dir\*" .
          "${{ github.sha }}" | Out-File -Encoding utf8 commit.txt
          git add -A
          git commit -qm "results for ${{ github.sha }}"
          git push -f origin "HEAD:$branch"
