name: build-and-test

on:
  push:
    branches-ignore: [release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # 結果を ci-results ブランチへ置くため（push のときだけ。フォークからの pull request は読み取りのみ）

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      # 使う人の多い日本時間（UTC+9）でも試す（windows-2022 は日本時間、windows-2025 は UTC のまま）。
      # UTC のままだと「未設定（MinValue）の日時を保存できない」問題が見つからなかったため。
      - name: Time zone (windows-2022 = Tokyo Standard Time)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          tzutil /s "Tokyo Standard Time"
          tzutil /g
          Get-Date -Format o

      - name: Windows / .NET Framework version
        shell: pwsh
        run: |
          [System.Environment]::OSVersion
          (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release

      - name: Build app with build.bat (Shift-JIS console)
        shell: cmd
        run: |
          chcp 932
          call build.bat > build-console.txt 2>&1
          set RC=%ERRORLEVEL%
          type build-console.txt
          if not "%RC%"=="0" exit /b 1
          dir dist

      - name: Build a newer version for the auto-update test (version 99)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force dist-next | Out-Null
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 /define:UPDATETEST /win32icon:app.ico /out:dist-next\AutoCopy.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Runtime.Serialization.dll /r:System.Xml.dll /r:System.Security.dll `
            src\*.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-Item dist-next\AutoCopy.exe).VersionInfo.FileVersion

      - name: Build a broken newer version for the update rollback test (version 100, exits right after update)
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          New-Item -ItemType Directory -Force dist-bad | Out-Null
          & $csc /nologo /target:winexe /platform:anycpu /optimize+ /codepage:65001 /define:UPDATETEST`;UPDATEFAIL /win32icon:app.ico /out:dist-bad\AutoCopy.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Runtime.Serialization.dll /r:System.Xml.dll /r:System.Security.dll `
            src\*.cs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-Item dist-bad\AutoCopy.exe).VersionInfo.FileVersion

      - name: Build test runner
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $sources = @(Get-ChildItem src -Filter '*.cs' | ForEach-Object FullName)
          $tests = @(Get-ChildItem tests -Filter '*.cs' | ForEach-Object FullName)
          New-Item -ItemType Directory -Force test | Out-Null
          & $csc /nologo /target:exe /main:AutoCopy.Tests.TestMain /platform:anycpu /codepage:65001 /out:test\AutoCopyTests.exe `
            /r:System.dll /r:System.Core.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /r:System.Runtime.Serialization.dll /r:System.Xml.dll /r:System.Security.dll `
            @sources @tests
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Prepare SMB share with a separate user
        shell: pwsh
        run: |
          $pw = 'Ac!Test-12345'
          net user actest $pw /add
          New-Item -ItemType Directory -Force C:\acshare | Out-Null
          icacls C:\acshare /grant "actest:(OI)(CI)F" | Out-Null
          New-SmbShare -Name acshare -Path C:\acshare -FullAccess actest | Out-Null
          "AC_SHARE=\\127.0.0.1\acshare" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_SHARE_LOCAL=C:\acshare"    | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_USER=$env:COMPUTERNAME\actest" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AC_PASS=$pw"                  | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # OneDrive と同じしくみ（Cloud Files）の試験（T127）のため、クラウド ファイルのドライバーが動いているか確かめる
      - name: Cloud Files filter (for the OneDrive test)
        shell: pwsh
        continue-on-error: true
        run: |
          sc.exe query cldflt
          fltmc load cldflt 2>&1 | Out-String | Write-Host
          fltmc filters | Out-String | Write-Host

      - name: Run tests
        shell: pwsh
        run: |
          .\test\AutoCopyTests.exe "$pwd\test-results.md" *> test-console.txt
          $code = $LASTEXITCODE
          Get-Content -Encoding utf8 test-console.txt
          "## Unit / engine tests (${{ matrix.os }})" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          Get-Content -Encoding utf8 test-results.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          exit $code

      - name: Integration test (real exe, tray, single instance, /run)
        if: always()
        shell: pwsh
        run: ./tests/integration.ps1 *>&1 | Tee-Object -FilePath integration-console.txt

      - name: Upgrade test (v1.13.0 auto-updates to this version)
        if: always()
        shell: pwsh
        run: |
          ./tests/upgrade-from-1.13.ps1 *>&1 | Tee-Object -FilePath upgrade-console.txt
          $code = $LASTEXITCODE
          if (Test-Path upgrade-results.md) { Get-Content upgrade-results.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          exit $code

      - name: Screenshots of all screens
        if: always()
        shell: pwsh
        run: |
          $env:AUTOCOPY_HOME = "$env:RUNNER_TEMP\shots-home"
          $p = Start-Process -FilePath "dist\AutoCopy.exe" -ArgumentList '/screenshots', "`"$pwd\screenshots`"" -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); "timeout" | Out-File screenshots\timeout.txt }
          Get-ChildItem screenshots | Select-Object Name, Length
          if (Test-Path screenshots\progress.txt) { "progress: " + (Get-Content -Encoding utf8 screenshots\progress.txt) }
          if (Test-Path screenshots\timing.txt) { Get-Content -Encoding utf8 screenshots\timing.txt | Select-Object -Last 8 }
          Get-Content -Encoding utf8 screenshots\errors.txt
          if ($p.ExitCode -ne 0 -or (Test-Path screenshots\timeout.txt)) { throw "Screenshot checks failed" }

      - name: Layout check at 125% / 150% text size (Windows 7 style DPI) and a small screen
        if: always()
        shell: pwsh
        run: |
          foreach ($cfg in '1.25|', '1.5|', '1|1093x582') {
            $sc, $scr = $cfg.Split('|')
            $dir = if ($scr) { "screenshots-small" } else { "screenshots-" + ($sc -replace '\.', '') }
            $env:AUTOCOPY_HOME = "$env:RUNNER_TEMP\shots-home-$sc-$scr"
            $env:AUTOCOPY_FONTSCALE = $sc
            $env:AUTOCOPY_SCREEN = if ($scr) { $scr } else { '1366x728' }
            $p = Start-Process -FilePath "dist\AutoCopy.exe" -ArgumentList '/screenshots', "`"$pwd\$dir`"" -PassThru
            if (-not $p.WaitForExit(420000)) { $p.Kill(); "timeout" | Out-File "$dir\timeout.txt" }
            "$cfg : " + (Get-Content -Encoding utf8 "$dir\layout-count.txt")
            if ($p.ExitCode -ne 0 -or (Test-Path "$dir\timeout.txt")) { throw "Layout checks failed: $cfg" }
          }
          Remove-Item Env:AUTOCOPY_FONTSCALE
          if (Test-Path Env:AUTOCOPY_SCREEN) { Remove-Item Env:AUTOCOPY_SCREEN }

      - name: Check dual signing (SHA1 + SHA256) by build.ps1 with a temporary certificate
        if: always()
        shell: pwsh
        run: |
          $work = "$env:RUNNER_TEMP\signcheck"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          New-Item -ItemType Directory -Force $work | Out-Null
          Copy-Item -Recurse src, build.ps1, app.ico, *.html, *.cer, *.bat -Destination $work
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=signing check' -CertStoreLocation Cert:\CurrentUser\My
          $pass = [Guid]::NewGuid().ToString('N')
          $pfx = "$env:RUNNER_TEMP\signcheck.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $pass -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\signcheck.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\signcheck.cer" -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $env:AUTOCOPY_SIGN_PFX = $pfx; $env:AUTOCOPY_SIGN_PASS = $pass
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$work\build.ps1" | Tee-Object -FilePath sign-console.txt
          if ($LASTEXITCODE -ne 0) { throw 'build.ps1 signing failed' }
          $signtool = @(Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending)[0].FullName
          $v = & $signtool verify /pa /all /v "$work\dist\AutoCopy.exe" 2>&1 | Out-String
          $v | Out-File -Append sign-console.txt
          $v -split "`n" | Select-String 'Hash of file|Signature Index|Number of'
          if ($v -notmatch 'Hash of file \(sha1\)' -or $v -notmatch 'Hash of file \(sha256\)') { throw 'Dual signature (SHA1 + SHA256) not found' }
          Remove-Item Cert:\LocalMachine\Root\$($cert.Thumbprint), Cert:\CurrentUser\My\$($cert.Thumbprint) -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: |
            test-results.md
            integration-results.md
            screenshots*/
            *console.txt
            dist/

      - name: Publish results to ci-results branch (push only)
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\results"
          New-Item -ItemType Directory -Force "$dir\${{ matrix.os }}" | Out-Null
          foreach ($f in 'build-console.txt','test-results.md','test-console.txt','integration-results.md','integration-console.txt','upgrade-results.md','upgrade-console.txt','sign-console.txt') { if (Test-Path $f) { Copy-Item $f "$dir\${{ matrix.os }}\" } }
          foreach ($x in 'screenshots', 'screenshots-125', 'screenshots-15', 'screenshots-small') { if (Test-Path $x) { Copy-Item -Recurse $x "$dir\${{ matrix.os }}\$x" } }
          if (Test-Path dist) { Copy-Item -Recurse dist "$dir\${{ matrix.os }}\dist" }
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          $branch = "ci-results-${{ matrix.os }}"
          git fetch origin $branch 2>$null
          git worktree add -B $branch "$env:RUNNER_TEMP\wt" 2>$null
          if (-not $?) { git worktree add --orphan -b $branch "$env:RUNNER_TEMP\wt" }
          Set-Location "$env:RUNNER_TEMP\wt"
          git rm -rq . 2>$null
          Copy-Item -Recurse -Force "$dir\*" .
          "${{ github.sha }}" | Out-File -Encoding utf8 commit.txt
          git add -A
          git commit -qm "results for ${{ github.sha }}"
          git push -f origin "HEAD:$branch"
