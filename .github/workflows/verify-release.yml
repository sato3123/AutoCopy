name: verify-signed-release

# 署名した配布用の exe（release フォルダ）を Windows で確かめる
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the signature, register the certificate, check again, run the app
        shell: pwsh
        run: |
          $out = New-Object System.Collections.Generic.List[string]
          function Line($s) { Write-Host $s; $out.Add($s) }
          $exe = (Resolve-Path 'release\AutoCopy.exe').Path
          $s1 = Get-AuthenticodeSignature $exe
          Line ("登録前: " + $s1.Status + " / " + $s1.SignerCertificate.Subject + " / 拇印 " + $s1.SignerCertificate.Thumbprint)
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*x64*' } | Select-Object -First 1
          if ($signtool) { Line ((& $signtool.FullName verify /pa /all /v $exe 2>&1 | Select-String 'Hash of file|Signing Certificate Chain|Issued to|Number of signatures|Signature Index|SignTool Error|Successfully|Expires' | ForEach-Object { $_.Line.Trim() }) -join ' | ') }
          # 配布用の登録バッチを、そのまま管理者で実行する
          Push-Location release
          $batOut = (cmd /c "chcp 932 >nul & 署名証明書を登録.bat < nul" 2>&1 | Out-String)
          Write-Host $batOut
          Line ("登録バッチ: " + (($batOut -split "`r?`n" | Where-Object { $_ -match 'certutil|CertUtil|Root|TrustedPublisher|登録' }) -join ' / '))
          Pop-Location
          $s2 = Get-AuthenticodeSignature $exe
          Line ("登録後: " + $s2.Status + " / " + $s2.StatusMessage)
          if ($signtool) { Line ((& $signtool.FullName verify /pa /all $exe 2>&1 | Out-String).Trim() -replace "`r?`n", ' | ') }
          $ver = (Get-Item $exe).VersionInfo
          Line ("版: " + $ver.FileVersion + " / 製品: " + $ver.ProductName + " / 会社: " + $ver.CompanyName)
          $env:AUTOCOPY_HOME = "$env:RUNNER_TEMP\rel-home"
          $p = Start-Process -FilePath $exe -ArgumentList '/screenshots', "`"$pwd\shots`"" -PassThru
          if (-not $p.WaitForExit(420000)) { $p.Kill(); Line "画面の確認: 時間切れ" }
          Line ("画面の確認のエラー: " + (Get-Content -Encoding utf8 shots\errors.txt -Raw))
          Line ("表示切れ: " + (Get-Content shots\layout-count.txt))
          $ok = ($s2.Status -eq 'Valid') -and ((Get-Content -Encoding utf8 shots\errors.txt -Raw).Trim() -eq 'なし')
          Line ("結果: " + $(if ($ok) { 'OK' } else { 'NG' }))
          $out | Out-File -Encoding utf8 verify.txt
          if (-not $ok) { exit 1 }

      - name: Publish results
        if: always()
        shell: pwsh
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          $dir = "$env:RUNNER_TEMP\res"
          New-Item -ItemType Directory -Force $dir | Out-Null
          if (Test-Path verify.txt) { Copy-Item verify.txt $dir }
          if (Test-Path shots) { Copy-Item -Recurse shots "$dir\shots" }
          $branch = "ci-release-${{ matrix.os }}"
          git worktree add --orphan -b $branch "$env:RUNNER_TEMP\wt"
          Set-Location "$env:RUNNER_TEMP\wt"
          Copy-Item -Recurse -Force "$dir\*" .
          "${{ github.sha }}" | Out-File -Encoding utf8 commit.txt
          git add -A
          git commit -qm "release check for ${{ github.sha }}"
          git push -f origin "HEAD:$branch"
